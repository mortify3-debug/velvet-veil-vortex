name: Update music and deploy

on:
  push:
    branches: [main]
    paths:
      - 'music/**'
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'assets/**'
      - 'generate-songs.mjs'
      - '.github/workflows/update-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate songs.json
        run: node generate-songs.mjs

      - name: Verify files
        run: |
          test -f index.html
          test -f songs.json
          echo '--- songs.json ---'
          cat songs.json
          echo '--- MP3 files ---'
          find music -maxdepth 1 -type f \( -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.ogg' -o -iname '*.wav' \) -printf '%f\n' || true

      - name: Commit generated songs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.json
          if git diff --cached --quiet; then
            echo "No changes in songs.json"
          else
            git commit -m "Update music catalog [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
