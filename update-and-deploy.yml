name: Update music and deploy

on:
  push:
    branches: [main]
    paths:
      - 'music/**'
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'assets/**'
      - 'generate-songs.mjs'
      - '.github/workflows/update-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate songs.json
        run: node generate-songs.mjs

      - name: Verify files
        run: |
          test -f index.html
          test -f assets/cover.png
          test -f songs.json
          echo 'songs.json:'
          cat songs.json
          echo 'MP3 files:'
          find music -maxdepth 1 -type f -iname '*.mp3' -printf '%f\n' || true

      - name: Commit generated songs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.json
          git diff --cached --quiet || git commit -m "Update music catalog"
          git push || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
