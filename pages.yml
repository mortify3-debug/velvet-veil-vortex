name: Deploy Velvet Veil Vortex

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate music catalog
        run: node generate-songs.mjs

      - name: Build
        run: node build.mjs

      - name: Verify site files
        run: |
          test -f dist/index.html
          test -f dist/assets/cover.png
          test -f dist/songs.json
          echo 'songs.json:'
          cat dist/songs.json
          echo 'MP3:'
          find dist/music -maxdepth 1 -type f -iname '*.mp3' -printf '%f\n'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
