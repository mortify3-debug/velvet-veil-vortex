<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07070a">
 <title>Velvet Veil Vortex — рок-группа | Слушать музыку онлайн и скачать MP3</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#home" aria-label="Velvet Veil Vortex">VELVET VEIL VORTEX</a>
  <nav><a href="#home">ГЛАВНАЯ</a><a href="#music">МУЗЫКА</a></nav>
</header>
<main>
<section id="home" class="hero">
  <img class="hero-cover" src="./assets/cover.png" alt="Velvet Veil Vortex">
  <div class="hero-shade"></div>
  <div class="hero-content">
    <div class="eyebrow">РОК / КИБЕРПАНК / NIGHT CITY</div>
    <h1>VELVET VEIL<br><span>VORTEX</span></h1>
    <p>ГРОМЧЕ ТВОИХ СТРАХОВ</p>
    <a class="hero-play" href="#music">СЛУШАТЬ МУЗЫКУ <span>▶</span></a>
  </div>
</section>
<section id="music" class="music-section">
  <div class="section-head"><div><div class="eyebrow">ПОСЛЕДНИЕ ТРЕКИ</div><h2>МУЗЫКА</h2></div><span id="track-count" class="count"></span></div>
  <div id="track-list" class="track-list" aria-live="polite"></div>
  <div id="empty" class="empty" hidden>Добавь MP3 в папку <b>music/</b> и сделай Commit в GitHub.</div>
</section>
</main>
<div class="player" id="player">
  <div class="player-art"><img id="player-cover" src="./assets/cover.png" alt=""></div>
  <div class="player-main">
    <div class="player-title" id="player-title">Выберите песню</div>
    <div class="progress-row"><span id="current-time">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div>
  </div>
  <div class="player-controls">
    <button id="prev" aria-label="Предыдущая">⏮</button><button id="play" class="play-btn" aria-label="Воспроизвести">▶</button><button id="next" aria-label="Следующая">⏭</button>
  </div>
  <a id="player-download" class="download" href="#" download hidden aria-label="Скачать">⇩</a>
  <audio id="audio" preload="metadata"></audio>
</div>
<script src="./app.js"></script>
</body>
</html>
